name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Prevent multiple Claude runs on the same PR or issue from interfering with each other
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.event.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # Job 1: Dedicated code review with a predefined prompt, triggered by '@claude review' on a PR
  claude-code-review:
    if: |
      (github.event.issue.pull_request || github.event.pull_request) &&
      (contains(github.event.comment.body, '@claude review') || contains(github.event.review.body, '@claude review'))
    runs-on: ubuntu-latest
    # 30, not 15: the first real run on a 26-file PR was killed at 15 min having produced nothing
    # (the action writes its result only at the end, so a killed run yields no review and no usage
    # data at all). A generous ceiling costs nothing on the runs that finish early.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number)) || (github.event.pull_request && format('refs/pull/{0}/head', github.event.pull_request.number)) || github.ref }}
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage (only for modified code)

            Report issues **only in lines this PR changed** — but read whatever you need to
            decide whether an issue is real: the changed files in full (diff hunks alone give
            too little context), their callers, their tests, and neighbouring implementations
            of the same pattern. Reading widely is fine; reporting widely is not.
            Do **not** make any code changes, run commands, or push code; only provide analysis and suggestions.

            Before reporting an issue, name the concrete input or state that triggers it and
            the wrong output, crash, or regression that results. Drop any issue where you
            cannot; where the justification is only "more robust" or "best practice"; or where
            a code comment explains it as a deliberate decision (read the comments before
            flagging). If you checked a concern and could not prove it but still believe it
            matters, report it as Suspected rather than dropping it or inflating its severity.
            A few defensible issues beat many speculative ones, and reporting no issues at all
            is a valid and useful outcome.

            Do not assert how a library or external service behaves from memory — in either
            direction. When the diff constructs a string that some other system parses (a
            SPARQL or SQL query, a URL or IIIF image request, a path template, a regex, a
            cron expression, a media-type string), you must check the constructed form
            against that system's own specification before you either report it **or clear
            it**. Well-formed is not the same as accepted: a form can be valid syntax, and
            listed as supported by the receiving system, and still be rejected at runtime
            because of a precondition attached to that form — a permitted value range, a
            limit that depends on the input data rather than on the string, a flag that must
            be present for the operation to be allowed. So do not stop at "the syntax is
            valid" or "the server supports this feature": find the preconditions the
            specification attaches to the form you built, and for each one name the input
            that would violate it or state why none can. Confirm against the version this
            repo builds with (`MODULE.bazel`) or the spec itself via web search. If you
            cannot complete that check, say so explicitly and grade the line Suspected — do
            not declare it correct.

            Structure your review as follows:
            1. Summary of PR changes (one paragraph)
            2. Identified issues, most severe first. For each: `file:line`, the failure
               scenario, and a suggested fix. Grade each as Critical, Major, Minor, or Suspected:
              - Critical: a bug, security vulnerability, or regression that reaches users.
                Only Critical issues prevent the PR from being ready to merge.
              - Major / Minor: worth fixing / worth noting, but do not affect merge readiness.
              - Suspected: a concern you could not prove — state what would confirm or refute
                it. Never blocks merge.
            3. Clear statement whether the PR is ready to merge (based **only** on Critical issues)

            Be constructive, precise, and concise. Avoid verbose explanations unless necessary for clarity.
            Read `REVIEW.md` at the repository root before you start; it is this repository's
            review checklist and its rules override the defaults above. Honour its "Skip"
            section — do not spend the run on diffs it tells you to skip.
            Use `gh pr comment` to leave your review as a comment on the PR.

          # Reading files is already in the action's base tool set; search and web lookup are
          # not, and the prompt above depends on both — Grep/Glob to check a suspicion against
          # the rest of the repo instead of guessing, WebSearch/WebFetch to check a dependency's
          # real API instead of recalling it. Bash stays confined to read-only gh commands.
          #
          # --model: pinned to Opus. In the 2026-08 prompt benchmark the model choice dominated
          # the prompt choice: Opus caught 6/6 planted bugs with zero blocking false positives;
          # Sonnet caught 1/6 and produced the only merge-blocking false positives.
          claude_args: '--model claude-opus-5 --allowed-tools "Grep,Glob,WebSearch,WebFetch,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

      # cancelled() as well as failure(): a `timeout-minutes` kill marks the job cancelled, not
      # failed, so the previous `if: failure()` skipped this step on the one run that most needed
      # it — the 15-minute timeout passed silently with no comment on the PR.
      - name: Notify on failure
        if: failure() || cancelled()
        run: |
          PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          if [ -n "$PR_NUMBER" ]; then
            gh issue comment "$PR_NUMBER" --body "⚠️ Claude Code Review did not complete (failed, timed out, or was cancelled). Check [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Job 2: General Claude assistant (flexible), triggered by '@claude <PROMPT>' on PRs, issues etc.
  # The negated clause is exactly job 1's condition, so the two jobs are mutually exclusive by
  # construction, while '@claude review' on a plain issue — where job 1 cannot run — still lands here.
  claude-general:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'assigned') && contains(github.event.issue.body, '@claude'))
      ) &&
      !(
        (github.event.issue.pull_request || github.event.pull_request) &&
        (contains(github.event.comment.body, '@claude review') || contains(github.event.review.body, '@claude review'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

      # Same cancelled() fix as job 1 — a timeout here would otherwise also pass silently.
      - name: Notify on failure
        if: failure() || cancelled()
        run: |
          PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          if [ -n "$PR_NUMBER" ]; then
            gh issue comment "$PR_NUMBER" --body "⚠️ Claude Code did not complete (failed, timed out, or was cancelled). Check [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
