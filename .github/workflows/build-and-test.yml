name: CI-build-and-test

on:
  # Run on every push to main to keep main green visible per-commit.
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - "**/graphite-base/**"

# Least-privilege token. `checks: write` is required by dorny/test-reporter.
permissions:
  contents: read
  checks: write

env:
  JAVA_VERSION: 25

# Release PRs (head branch `release-please--*`, opened by release-please) only
# bump CHANGELOG.md and version.txt — no source changes — so every job below is
# skipped for them via `!startsWith(github.head_ref, 'release-please')`. This
# saves CI resources and lets the release PR go green immediately. On `push`
# events `github.head_ref` is empty, so main pushes still run the full suite.
# A required check skipped by a job-level `if:` counts as passing in branch
# protection, so the release PR stays mergeable. See DEV-6678.

jobs:
  # All pure-JVM unit tests run in a single job: one `bazel test` over every
  # module lets Bazel + the RBE backend parallelize the test actions internally,
  # instead of paying per-job (checkout + Nix + cache-restore + cold-JVM)
  # overhead four times. The Docker/testcontainer suites stay in their own jobs
  # (they are `exclusive`, so one invocation would serialize them).
  unit-tests:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    steps:
      - name: Checkout (bootstrap so the local preparation action resolves)
        uses: actions/checkout@v5
      - name: Run preparatory steps
        uses: ./.github/actions/preparation
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Nix (Bazel drives the build)
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Restore Bazel repository cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Remote Build Execution (mTLS + flags)
        id: rbe
        uses: ./.github/actions/bazel-rbe
        with:
          # Stage 2: remote EXECUTOR — compiles + tests run on the NativeLink worker (the unit-tests
          # spike proved this green: 1483/2464 actions remote, all tests pass). All Bazel jobs use it;
          # Docker/testcontainer test targets still run local via their `no-remote` tag.
          # `--remote_local_fallback` degrades to a local build if the worker is unreachable.
          stage: full
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Run all unit tests
        run: nix develop --command just test-unit ${{ steps.rbe.outputs.flags }} --build_event_json_file=bep-unit.json
      # Attach the Build Event Protocol JSON so the remote/action cache hit
      # rate on the NativeLink RBE backend can be analyzed offline. Bazel
      # emits one BuildMetrics event per invocation whose
      # actionSummary.runnerCount[] breaks actions down by runner type
      # (total / remote cache hit / remote / local / internal). `always()`
      # so a failed build's breakdown (often the most interesting) is still
      # captured.
      - name: Upload build event JSON (cache-hit-rate analysis)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bep-unit
          path: bep-unit.json
          retention-days: 30
      - name: Collect Bazel test XML
        if: success() || failure()
        run: |
          mkdir -p test-xml
          cp -L bazel-testlogs/modules/webapi/test/test.xml test-xml/webapi-test.xml || true
          cp -L bazel-testlogs/modules/ingest/test/test.xml test-xml/ingest-test.xml || true
          cp -L bazel-testlogs/modules/bagit/test/test.xml test-xml/bagit-test.xml || true
          cp -L bazel-testlogs/modules/jwt/test/test.xml test-xml/jwt-test.xml || true
          cp -L bazel-testlogs/modules/shacl-validator/test/test.xml test-xml/shacl-validator-test.xml || true
      - name: Unit Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Unit Test Results
          path: test-xml/*.xml
          reporter: java-junit

  test-it:
    name: Build and IT Test
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    concurrency:
      group: ${{ github.ref }}-it
      cancel-in-progress: true
    steps:
      - name: Checkout (bootstrap so the local preparation action resolves)
        uses: actions/checkout@v5
      - name: Run preparatory steps
        uses: ./.github/actions/preparation
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Nix (Bazel drives the build and image loads)
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Restore Bazel repository cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Remote Build Execution (mTLS + flags)
        id: rbe
        uses: ./.github/actions/bazel-rbe
        with:
          stage: full
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Run integration tests
        # `just test-it` loads the PR's sipi/ingest/fuseki images (via its
        # docker-load-test-images prerequisite) before running the Bazel tests,
        # so the PR's own images are exercised, not the registry's lagging :latest.
        run: nix develop --command just test-it ${{ steps.rbe.outputs.flags }} --build_event_json_file=bep-it.json
      # BEP for offline RBE cache-hit-rate analysis (cf. the unit-tests job).
      # The `:load` prerequisites overwrite this file in turn, so it ends up
      # holding the `bazel test` invocation's metrics — the one that matters.
      - name: Upload build event JSON (cache-hit-rate analysis)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bep-it
          path: bep-it.json
          retention-days: 30
      - name: Collect Bazel test XML
        if: success() || failure()
        run: |
          mkdir -p test-xml
          cp -L bazel-testlogs/modules/test-it/test/test.xml test-xml/test-it-test.xml || true
          cp -L bazel-testlogs/modules/test-it/test_gravsearch_span/test.xml test-xml/test-it-gravsearch-span.xml || true
      - name: WebApi IT Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: WebApi IT Test Results
          path: test-xml/*.xml
          reporter: java-junit

  test-e2e:
    name: Build and E2E Test
    runs-on: ubuntu-latest-large-runner
    if: ${{ !startsWith(github.head_ref, 'release-please') }}
    concurrency:
      group: ${{ github.ref }}-e2e
      cancel-in-progress: true
    steps:
      - name: Checkout (bootstrap so the local preparation action resolves)
        uses: actions/checkout@v5
      - name: Run preparatory steps
        uses: ./.github/actions/preparation
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Nix (Bazel drives the build and image loads)
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Restore Bazel repository cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Remote Build Execution (mTLS + flags)
        id: rbe
        uses: ./.github/actions/bazel-rbe
        with:
          stage: full
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Run end-to-end tests
        # `just test-e2e` loads the PR's sipi/ingest/fuseki images (via its
        # docker-load-test-images prerequisite) before running the Bazel tests.
        run: nix develop --command just test-e2e ${{ steps.rbe.outputs.flags }} --build_event_json_file=bep-e2e.json
      # BEP for offline RBE cache-hit-rate analysis (cf. the unit-tests job).
      # The `:load` prerequisites overwrite this file in turn, so it ends up
      # holding the `bazel test` invocation's metrics — the one that matters.
      - name: Upload build event JSON (cache-hit-rate analysis)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bep-e2e
          path: bep-e2e.json
          retention-days: 30
      - name: Collect Bazel test XML
        if: success() || failure()
        run: |
          mkdir -p test-xml
          cp -L bazel-testlogs/modules/test-e2e/test/test.xml test-xml/test-e2e-test.xml || true
      - name: WebApi E2E Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: WebApi E2E Test Results
          path: test-xml/*.xml
          reporter: java-junit

  test-ingest-integration:
    name: Build and Ingest Integration Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please') # gate-only, no coverage upload; release PRs skipped (DEV-6678)
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Install Nix (Bazel drives the build and image loads)
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Restore Bazel repository cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Remote Build Execution (mTLS + flags)
        id: rbe
        uses: ./.github/actions/bazel-rbe
        with:
          stage: full
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Run integration tests
        run: nix develop --command just test-ingest-integration ${{ steps.rbe.outputs.flags }} --build_event_json_file=bep-ingest-integration.json
      # BEP for offline RBE cache-hit-rate analysis (cf. the unit-tests job).
      # The `:load` prerequisites overwrite this file in turn, so it ends up
      # holding the `bazel test` invocation's metrics — the one that matters.
      - name: Upload build event JSON (cache-hit-rate analysis)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bep-ingest-integration
          path: bep-ingest-integration.json
          retention-days: 30
      - name: Collect Bazel test XML
        if: success() || failure()
        run: |
          mkdir -p test-xml
          cp -L bazel-testlogs/modules/test-ingest-integration/test/test.xml test-xml/test-ingest-integration-test.xml || true
      - name: WebApi Ingest Integration Test Report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: WebApi Ingest Integration Test Results
          path: test-xml/*.xml
          reporter: java-junit

  test-docs-build:
    name: Docs Test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please') # gate-only, no coverage upload; release PRs skipped (DEV-6678)
    steps:
      - name: Checkout (bootstrap so the local preparation action resolves)
        uses: actions/checkout@v5
      - name: Run preparatory steps
        uses: ./.github/actions/preparation
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: Checkout source
        uses: actions/checkout@v5
      - uses: extractions/setup-just@v2
      - name: Install requirements (pip, npm, apt)
        run: |
          just docs-install-requirements
          npm install --global typedoc
          sudo apt-get install graphviz
      - name: markdownlint
        run: just markdownlint
      - name: Build docs
        run: just docs-build

  check-formatting:
    name: Check formatting
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please') # gate-only, no coverage upload; release PRs skipped (DEV-6678)
    steps:
      - name: Checkout (bootstrap so the local preparation action resolves)
        uses: actions/checkout@v5
      - name: Run preparatory steps
        uses: ./.github/actions/preparation
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Nix (Bazel drives scalafmt + the header check)
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Restore Bazel repository cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Remote Build Execution (mTLS + flags)
        id: rbe
        uses: ./.github/actions/bazel-rbe
        with:
          stage: full
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Check formatting (scalafmt) + license headers
        run: nix develop --command just check ${{ steps.rbe.outputs.flags }}

  docker-healthcheck:
    name: Run the healthcheck from the container
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please') # gate-only, no coverage upload; release PRs skipped (DEV-6678)
    steps:
      - name: Checkout (bootstrap so the local preparation action resolves)
        uses: actions/checkout@v5
      - name: Run preparatory steps
        uses: ./.github/actions/preparation
        with:
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install Nix (Bazel drives the image builds)
        uses: DeterminateSystems/determinate-nix-action@v3
      - name: Enable Nix build cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Restore Bazel repository cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-
      - name: Set up Remote Build Execution (mTLS + flags)
        id: rbe
        uses: ./.github/actions/bazel-rbe
        with:
          stage: full
          runner-endpoint: ${{ vars.REMOTEBUILD_RUNNER_ENDPOINT }}
          ca-cert: ${{ secrets.REMOTEBUILD_CA_CERT }}
          client-cert: ${{ secrets.REMOTEBUILD_CLIENT_CERT }}
          client-key: ${{ secrets.REMOTEBUILD_CLIENT_KEY }}
      - name: Build images locally
        # Build knora-api, knora-sipi and fuseki so docker compose picks up the
        # PR's images. The registry's :latest for knora-sipi lags by a merge,
        # which matters across major Sipi base-image bumps (e.g. v4 -> v5
        # changed CLI surface and the compose `command:`).
        #
        # Fuseki's registry :latest likewise lags by a merge, and this PR changes the
        # Fuseki assembler (modules/fuseki/dsp-repo.ttl). Build it here so the `db`
        # healthcheck runs against the PR's own assembler config, not the stale registry image.
        run: |
          nix develop --command just docker-build-dsp-api-image ${{ steps.rbe.outputs.flags }}
          nix develop --command just docker-build-sipi-image ${{ steps.rbe.outputs.flags }}
          nix develop --command just docker-build-fuseki-image ${{ steps.rbe.outputs.flags }}
      - name: Spin up the API container and wait for all healthchecks (incl. db and sipi) to pass
        run: docker compose up --wait api
