name: Release-create-release

on:
  push:
    branches:
      - main

# Several pushes to main in quick succession each start a run, and they all force-push the same
# release-please branch. Never cancel a running one: the next run waits for it (GitHub keeps only
# the newest pending run, which sees every commit) instead of racing it on --force-with-lease.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    name: Create release PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'dasch-swiss'
    steps:
      - name: Run release please action
        uses: googleapis/release-please-action@v4
        with:
          # A PAT, not GITHUB_TOKEN: a release created with GITHUB_TOKEN triggers no further
          # workflows, so publish-release.yml (on `release`) would never run.
          token: ${{ secrets.GH_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
