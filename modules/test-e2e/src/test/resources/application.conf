app {
  // The E2E suite drives POST /admin/sparql/query; without this the route is not registered and every
  // passthrough test would see a 404 instead of the behaviour under test.
  allow-sparql-passthrough = true

  triplestore {
    dbtype = "fuseki"

    fuseki {
      port = 3030
      username = "admin"
      password = "test"
    }

    reload-on-start = false

    is-test-env = true
  }

  // The landing page splices its head block into dsp-app's shell; the E2E spec serves a stub at this address.
  fair {
    app-external-base-url = "http://localhost:4200"
    app-shell-url = "http://localhost:18742/index.html"
  }

  features {
    allow-erase-projects = true
    allow-project-data-import = true
  }
}
