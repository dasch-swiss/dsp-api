// Settings of the ingest slice, read only by IngestConfig. Every environment variable is INGEST_-prefixed;
// none of these keys or variables is read by webapi's application.conf.
ingest {
    storage {
        asset-dir = "/opt/images"
        asset-dir = ${?INGEST_STORAGE_ASSET_DIR}
        temp-dir = "/opt/temp"
        temp-dir = ${?INGEST_STORAGE_TEMP_DIR}
    }

    sipi {
        // true runs Sipi through `docker run`, for running dsp-api outside a container
        use-local-dev = false
        use-local-dev = ${?INGEST_SIPI_USE_LOCAL_DEV}
        local-dev-image = "daschswiss/knora-sipi:latest"
        local-dev-image = ${?INGEST_SIPI_LOCAL_DEV_IMAGE}
    }

    bulk-max-parallel = 8
    bulk-max-parallel = ${?INGEST_BULK_MAX_PARALLEL}

    features {
        allow-erase-projects = false
        allow-erase-projects = ${?INGEST_ALLOW_ERASE_PROJECTS}
    }

    executor {
        // share of the available processors used for ingest work, in (0, 1]
        cpu-share = 0.5
        cpu-share = ${?INGEST_EXECUTOR_CPU_SHARE}
    }
}
