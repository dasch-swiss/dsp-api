app {
    bcrypt-password-strength = 12 // Value range is 4-31.
    bcrypt-password-strength = ${?KNORA_WEBAPI_BCRYPT_PASSWORD_STRENGTH}


    // this domain will be set in the session cookie. needs to be set to the parent domain
    // under which webapi and sipi will run, i.e. example.com if 'api.example.com' and 'iiif.example.com'
    // are used for webapi and sipi.
    cookie-domain = "0.0.0.0"
    cookie-domain = ${?KNORA_WEBAPI_COOKIE_DOMAIN}

    // DANGER: If true, will accept messages to the /admin/store route, which allows to restore the contend of the triplestore
    allow-reload-over-http = false
    allow-reload-over-http = ${?KNORA_WEBAPI_ALLOW_RELOAD_OVER_HTTP}

    // DANGER: If true, registers the admin SPARQL passthrough route (POST /admin/sparql/query), which forwards a
    // SystemAdmin's raw SPARQL to the triplestore and relays the store's response verbatim. Fail-closed: the
    // built-in default is false, so a deployment that omits the env override leaves the route absent (404).
    // The value is read at startup only -- flipping it requires an API restart.
    // Precondition for enabling this on an environment: verify that the store refuses federated SERVICE calls
    // (arq:httpServiceAllowed = false), or a plain SELECT can make the store issue outbound HTTP on the caller's
    // behalf. See docs/03-endpoints/api-admin/sparql-passthrough.md.
    allow-sparql-passthrough = false
    allow-sparql-passthrough = ${?KNORA_WEBAPI_ALLOW_SPARQL_PASSTHROUGH}

    fallback-language = "en"

    // configuration for the JWT authentication
    jwt {
        secret = "UP 4888, nice 4-8-4 steam engine"
        secret = ${?KNORA_WEBAPI_JWT_SECRET_KEY}
        expiration = 30 days
        expiration = ${?KNORA_WEBAPI_JWT_LONGEVITY}
        issuer = ${?KNORA_WEBAPI_JWT_ISSUER}
    }

    dsp-ingest {
        base-url = "http://localhost:3340"
        base-url = ${?KNORA_WEBAPI_DSP_INGEST_BASE_URL}
        // client-facing URL for download links; defaults to base-url, set to the public host when they differ
        external-base-url = ${app.dsp-ingest.base-url}
        external-base-url = ${?KNORA_WEBAPI_DSP_INGEST_EXTERNAL_BASE_URL}
        audience = "http://localhost:3340"
        audience = ${?KNORA_WEBAPI_DSP_INGEST_AUDIENCE}
    }

    knora-api {
        // relevant for direct communication inside the knora stack
        internal-host = "0.0.0.0"
        internal-host = ${?KNORA_WEBAPI_KNORA_API_INTERNAL_HOST}
        internal-port = 3333
        internal-port = ${?KNORA_WEBAPI_KNORA_API_INTERNAL_PORT}

        // relevant for the client, i.e. browser
        external-protocol = "http" // optional ssl termination needs to be done by the proxy
        external-protocol = ${?KNORA_WEBAPI_KNORA_API_EXTERNAL_PROTOCOL}
        external-host = "0.0.0.0"
        external-host = ${?KNORA_WEBAPI_KNORA_API_EXTERNAL_HOST}
        external-port = 3333
        external-port = ${?KNORA_WEBAPI_KNORA_API_EXTERNAL_PORT}

        external-zio-port = 5555
    }

    sipi {
        // relevant for direct communication inside the knora stack
        internal-protocol = "http"
        internal-protocol = ${?KNORA_WEBAPI_SIPI_INTERNAL_PROTOCOL}
        internal-host = "0.0.0.0"
        internal-host = ${?KNORA_WEBAPI_SIPI_INTERNAL_HOST}
        internal-port = 1024
        internal-port = ${?KNORA_WEBAPI_SIPI_INTERNAL_PORT}

        timeout = 120 seconds

        // relevant for the client, i.e. browser
        external-protocol = "http"
        external-protocol = ${?KNORA_WEBAPI_SIPI_EXTERNAL_PROTOCOL}
        external-host = "0.0.0.0"
        external-host = ${?KNORA_WEBAPI_SIPI_EXTERNAL_HOST}
        external-port = 1024
        external-port = ${?KNORA_WEBAPI_SIPI_EXTERNAL_PORT}

        file-server-path = "server"

        move-file-route = "store"
        delete-temp-file-route = "delete_temp_file"

        image-mime-types = ["image/tiff", "image/jpeg", "image/png", "image/jp2", "image/jpx"]
        document-mime-types = [
            "application/epub+zip",
            "application/pdf",
            "application/msword",
            "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            "application/vnd.ms-excel",
            "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
            "application/vnd.ms-powerpoint",
            "application/vnd.openxmlformats-officedocument.presentationml.presentation",
        ]
        text-mime-types = [
            "application/json",
            "application/odd+xml",
            "application/rng+xml",
            "application/xml",
            "application/xsd+xml",
            "application/xslt+xml",
            "text/csv",
            "text/html",
            "text/plain",
            "text/xml",
        ]
        video-mime-types = ["video/mp4"]
        audio-mime-types = ["audio/mpeg", "audio/wav", "audio/x-wav", "audio/vnd.wave"]
        archive-mime-types = [
            "application/zip",
            "application/x-tar",
            "application/gzip",
            "application/x-7z-compressed",
            "application/x-compress",
        ]
    }

    ark {
        resolver = "http://0.0.0.0:3336"
        resolver = ${?KNORA_WEBAPI_ARK_RESOLVER_URL}
        assigned-number = 72163
        assigned-number = ${?KNORA_WEBAPI_ARK_NAAN}
    }

    tmp-datadir = "/tmp/webapi_tmp/" // dir must exist on disk!

    v2 {
        resources-sequence {
            results-per-page = 25 // results to be returned per page
        },
        fulltext-search {
            search-value-min-length = 3
            // DEV-6864 PROBE: refuse a fulltext search whose Lucene candidate count exceeds `cap`, measured by a
            // fast COUNT raced against the real query so an admitted term pays no tax and a refused one returns
            // fast. 250,000 fits the 60s search tier with headroom (Spike A). `cache-*` bound the measured-breadth
            // cache; `max-concurrent` bounds probes in flight against Fuseki.
            probe {
                cap = 250000
                cap = ${?KNORA_WEBAPI_FULLTEXT_PROBE_CAP}
                cache-capacity = 1024
                cache-ttl = 10 minutes
                max-concurrent = 8
            }
        },
        graph-route {
            default-graph-depth = 4
            max-graph-depth = 10
            max-graph-breadth = 50
        },
        resources {
            // Maximum number of resource IRIs accepted in one POST /v2/resources/batch request.
            // Operational guardrail; overridable per deployment without a code change. The response
            // is buffered (not streamed), so a large batch of standoff-heavy resources can exceed the
            // proxy idle timeout — kept in line with the export batch-size for that reason.
            max-batch-size = 100
            max-batch-size = ${?KNORA_WEBAPI_V2_RESOURCES_MAX_BATCH_SIZE}
        }
    }

    // Tuning knobs for the streaming CSV export (POST /v3/export/resources). Operational values, overridable per
    // deployment via env var without a code change/release/deploy.
    export {
        // resources fetched and encoded per triplestore round-trip. The stream flushes one chunk per batch, so this
        // also bounds the gap between bytes on the wire: a batch must complete (standoff CONSTRUCT + row encoding)
        // before its rows are sent. Keep it small enough that even rich-text/standoff-heavy classes finish a batch
        // well under the ingress idle timeout (60s on prod) — otherwise the connection is dropped mid-stream and the
        // download fails with an empty body. Tuned conservatively for heavy classes (e.g. footnoted literary text),
        // not just light ones; the env override lets ops raise it per deployment for light-resource projects.
        batch-size = 100
        batch-size = ${?KNORA_WEBAPI_EXPORT_BATCH_SIZE}
        // number of batches fetched concurrently
        parallelism = 5
        parallelism = ${?KNORA_WEBAPI_EXPORT_PARALLELISM}
    }

    triplestore {
        dbtype = "fuseki"
        dbtype = ${?KNORA_WEBAPI_TRIPLESTORE_DBTYPE}

        use-https = false
        use-https = ${?KNORA_WEBAPI_TRIPLESTORE_USE_HTTPS}

        host = "localhost"
        host = ${?KNORA_WEBAPI_TRIPLESTORE_HOST}

        // timeout for triplestore queries.
        query-timeout = 20 seconds

        // timeout for triplestore queries for maintenance actions.
        maintenance-timeout = 120 seconds

        // timeout for Gravsearch queries.
        gravsearch-timeout = 120 seconds

        // timeout for the fulltext search prequery and count (DEV-6864). Longer than query-timeout so the
        // prequery is not cut before the 120s main query that follows it, but shorter than gravsearch-timeout
        // so a broad query still sheds load. Overridable so a bad value can be corrected without a release.
        search-timeout = 60 seconds
        search-timeout = ${?KNORA_WEBAPI_TRIPLESTORE_SEARCH_TIMEOUT}

        fuseki {
            port = 3030
            port = ${?KNORA_WEBAPI_TRIPLESTORE_FUSEKI_PORT}
            repository-name = "dsp-repo"
            repository-name = ${?KNORA_WEBAPI_TRIPLESTORE_FUSEKI_REPOSITORY_NAME}
            username = "admin"
            username = ${?KNORA_WEBAPI_TRIPLESTORE_FUSEKI_USERNAME}
            password = "test"
            password = ${?KNORA_WEBAPI_TRIPLESTORE_FUSEKI_PASSWORD}
            query-logging-threshold = 1s
            query-logging-threshold = ${?KNORA_WEBAPI_TRIPLESTORE_FUSEKI_QUERY_LOGGING_THRESHOLD}
            allow-compaction = false
            allow-compaction = ${?KNORA_WEBAPI_TRIPLESTORE_FUSEKI_ALLOW_COMPACTION}
        }

        // If true, the time taken by each SPARQL query is logged at DEBUG level. To see these messages,
        // set loglevel = "DEBUG" above, and
        // <logger name="org.knora.webapi.store.triplestore.http.HttpTriplestoreConnector" level="DEBUG"/>
        // in logback.xml.
        profile-queries = false

        // Guardrails for the admin SPARQL passthrough surface (POST /admin/sparql/query), gated by
        // app.allow-sparql-passthrough above. Operational values, overridable per deployment via env var without a
        // code change/release/deploy. They live here because all four bound an interaction with the triplestore.
        sparql-passthrough {
            // Sent to the store as its per-request execution timeout, so an over-time query is cancelled by the
            // store's engine rather than merely abandoned client-side. Also sizes the API-side deadline, which is
            // what releases the fiber, the connection and the response buffer if the store drips bytes indefinitely.
            timeout = 120 seconds
            timeout = ${?KNORA_WEBAPI_SPARQL_PASSTHROUGH_TIMEOUT}
            // Maximum size of the submitted SPARQL text. Enforced on that one endpoint only -- a global cap of this
            // size would reject the larger project-import upload.
            max-request-body-bytes = 1048576
            max-request-body-bytes = ${?KNORA_WEBAPI_SPARQL_PASSTHROUGH_MAX_REQUEST_BODY_BYTES}
            // Maximum number of bytes read back from the store, counted before any response compression. The
            // response is buffered to this ceiling before anything is sent, so a breach is a clean error and never a
            // truncated body -- which also means this value sizes per-request heap use, at one copy per call.
            max-response-bytes = 67108864
            max-response-bytes = ${?KNORA_WEBAPI_SPARQL_PASSTHROUGH_MAX_RESPONSE_BYTES}
            // Surface-wide backstop on calls in flight; a call arriving while it is saturated is rejected with 503,
            // never queued. Worst-case buffered heap is roughly max-response-bytes * max-concurrent-calls, so
            // raising either raises that bound.
            max-concurrent-calls = 8
            max-concurrent-calls = ${?KNORA_WEBAPI_SPARQL_PASSTHROUGH_MAX_CONCURRENT_CALLS}
        }
    }

    instrumentation-server-config {
        port = 3339
        port = ${?KNORA_INSTRUMENTATION_SERVER_PORT}
        interval = 5 seconds
    }

    // Short-lived cache for asset (file) permission checks on the IIIF tile-serving path (DEV-6806). A single tiled
    // image fires many identical GET /admin/files/{shortcode}/{filename} checks in a short burst; caching the decision
    // sheds the repeated triplestore round-trip and permission computation within that burst. Operational knobs,
    // overridable per deployment via env var without a code change/release/deploy.
    file-permission-cache {
        // how long a computed decision is retained before it is re-resolved. Staleness (a revocation or a new grant)
        // therefore lags by at most one ttl; keep it short. Validated at load to be > 0 and <= 10 minutes.
        ttl = 2 minutes
        ttl = ${?KNORA_WEBAPI_FILE_PERMISSION_CACHE_TTL}
        // maximum number of cached decisions; eviction beyond this bound is delegated to zio-cache.
        capacity = 10000
        capacity = ${?KNORA_WEBAPI_FILE_PERMISSION_CACHE_CAPACITY}
    }

    features {
        allow-erase-projects = false
        allow-erase-projects = ${?ALLOW_ERASE_PROJECTS}

        trigger-compaction-after-project-erasure = false
        trigger-compaction-after-project-erasure = ${?TRIGGER_COMPACTION_AFTER_PROJECT_ERASURE}

        disable-last-modification-date-check = false
        disable-last-modification-date-check = ${?DISABLE_LAST_MODIFICATION_DATE_CHECK}

        allow-import-migration-bagit = true
        allow-import-migration-bagit = ${?ALLOW_IMPORT_MIGRATION_BAGIT}

        allow-placeholder = true
        allow-placeholder = ${?ALLOW_PLACEHOLDER}

        allow-project-data-import = false
        allow-project-data-import = ${?ALLOW_PROJECT_DATA_IMPORT}
    }
}
