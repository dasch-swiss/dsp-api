  /v3/projects/{projectIri}/resourcesPerOntology:
    get:
      tags:
      - API v3
      description: This endpoint returns all ontologies in a project along with their
        resource classes and the count of resource instances for each class. Note
        that the `itemCount` includes only non-deleted resources and it includes resources
        even if the current user may not be permitted to see some of them, for performance
        reasons.
      operationId: getV3ProjectsProjectiriResourcesperontology
      parameters:
      - name: projectIri
        in: path
        description: The IRI of a project. Must be URL-encoded.
        required: true
        schema:
          type: string
        example: http://rdfh.ch/projects/0001
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OntologyAndResourceClasses'
              example:
              - ontology:
                  iri: http://0.0.0.0:3333/ontology/0001/anything/v2
                  label: The anything ontology
                  comment: A sample ontology for anything
