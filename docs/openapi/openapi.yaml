  /v2/standoff/canonicalize:
    post:
      tags:
      - Experimental
      - API v2
      description: 'Experimental -- may change or be removed without notice; do not
        depend on it for production integrations. Returns the canonical form of the
        given standard-mapping rich-text XML: the exact XML dsp-api would return when
        reading such a value back. This conversion is idempotent, so a client can
        compare the canonical form of its own source against the `textValueAsXml`
        of a stored value to decide whether a rich-text value has actually changed.
        (Raw input is only isomorphic to what dsp-api stores, not byte-identical,
        which makes a direct string comparison unreliable.) Only the standard mapping
        is supported. Requires authentication.'
      operationId: postV2StandoffCanonicalize
      requestBody:
        description: The rich-text XML to canonicalize, interpreted with the standard
          standoff mapping.
        content:
          text/plain:
            schema:
              type: string
        required: true
      responses:
        '200':
          description: 'The canonical XML: the input round-tripped through standoff
            markup and back.'
          content:
            application/xml:
              schema:
                type: string
        '400':
          description: ''
