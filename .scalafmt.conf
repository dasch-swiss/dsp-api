version = "3.10.7"
runner.dialect = scala3
maxColumn = 120
align.preset = most
align.multiline = false
indent.defnSite = 2
assumeStandardLibraryStripMargin = true
docstrings.style = Asterisk
docstrings.wrap = "no"
lineEndings = preserve
includeCurlyBraceInSelectChains = false
danglingParentheses.preset = true
optIn.annotationNewlines = true
newlines.alwaysBeforeMultilineDef = false

rewrite.rules = [Imports, RedundantBraces]

# Import organization (replaces sbt-scalafix OrganizeImports). scalafmt groups
# imports by the regexes below in order; imports matching none form a final
# group. NOTE: this puts third-party imports LAST, whereas scalafix put them
# first — an unavoidable scalafmt behavior (the unmatched/catch-all group is
# always emitted last). Unused-import removal is handled by scalac -Wunused:all
# -Werror, not scalafmt.
rewrite.imports.sort = ascii
rewrite.imports.expand = true
rewrite.imports.groups = [
  [".*"],
  ["javax?\\..*", "scala\\..*"],
  ["dsp\\..*", "org\\.knora\\..*"],
]

rewrite.redundantBraces.generalExpressions = false
rewriteTokens = {
  "⇒": "=>"
  "→": "->"
  "←": "<-"
}
rewrite.trailingCommas.style = always
