version = "3.10.7"
runner.dialect = scala3
maxColumn = 120
align.preset = most
align.multiline = false
indent.defnSite = 2
assumeStandardLibraryStripMargin = true
docstrings.style = Asterisk
docstrings.wrap = "no"
lineEndings = preserve
includeCurlyBraceInSelectChains = false
danglingParentheses.preset = true
optIn.annotationNewlines = true
newlines.alwaysBeforeMultilineDef = false

rewrite.rules = [Imports, RedundantBraces]

# Import organization (replaces sbt-scalafix OrganizeImports). scalafmt emits
# one group per entry below, in order; an import that also matches a more
# specific entry goes there, not to the catch-all. Result: third-party (zio
# included) first, then java/scala, then dsp/org.knora. Unused-import removal is handled by scalac -Wunused:all
# -Werror, not scalafmt.
rewrite.imports.sort = ascii
rewrite.imports.expand = true
rewrite.imports.groups = [
  [".*"],
  ["javax?\\..*", "scala\\..*"],
  ["dsp\\..*", "org\\.knora\\..*"],
]

rewrite.redundantBraces.generalExpressions = false
rewriteTokens = {
  "⇒": "=>"
  "→": "->"
  "←": "<-"
}
rewrite.trailingCommas.style = always
